<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210" />
      <stop offset="100%" stop-color="#211c18" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a241f" />
      <stop offset="100%" stop-color="#1d1916" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36291f" />
      <stop offset="100%" stop-color="#241a13" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Subtle Grid Accent -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="750" />
    <line x1="1120" y1="0" x2="1120" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="620" x2="1200" y2="620" />
  </g>

  <!-- Header Category -->
  <text x="80" y="85" font-family="'DM Mono', monospace" font-size="12" letter-spacing="3" fill="#b09b88" text-transform="uppercase">
    SOLE TRUST MEDIA · STRATEGIC FRAMEWORK
  </text>
  <rect x="1020" y="68" width="100" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" />
  <text x="1070" y="85" font-family="'DM Mono', monospace" font-size="10" letter-spacing="2" fill="#e8dfd3" text-anchor="middle">
    ESSAY 01
  </text>

  <!-- Main Headline -->
  <text x="80" y="195" font-family="'Playfair Display', Georgia, serif" font-size="56" font-weight="500" fill="#f5ede0" letter-spacing="-1">
    Trends Are a Tool,
  </text>
  <text x="80" y="260" font-family="'Playfair Display', Georgia, serif" font-size="56" font-style="italic" fill="#c99763" letter-spacing="-1">
    Not a Strategy.
  </text>

  <!-- Subheadline -->
  <text x="80" y="315" font-family="'DM Mono', monospace" font-size="17" fill="#a89a8c" letter-spacing="0.5">
    People are watching your posts. So why aren't they buying?
  </text>

  <!-- Comparison Cards Grid -->
  <!-- Card A: Trend-Led -->
  <g filter="url(#shadow)">
    <rect x="80" y="365" width="490" height="205" rx="16" fill="url(#cardGrad1)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <rect x="108" y="392" width="76" height="20" rx="10" fill="#ffffff" fill-opacity="0.08" />
    <text x="146" y="406" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1.5" fill="#998878" text-anchor="middle">
      STORE A
    </text>
    <text x="108" y="445" font-family="'Playfair Display', Georgia, serif" font-size="20" fill="#d9cfc3">
      Funny Trending Audio Reel
    </text>
    <text x="108" y="485" font-family="'DM Mono', monospace" font-size="28" font-weight="700" fill="#887869">
      100,000 <tspan font-size="12" font-weight="400" fill="#736557">VIEWS</tspan>
    </text>
    <text x="108" y="525" font-family="'DM Mono', monospace" font-size="11" fill="#c06c58" letter-spacing="0.5">
      Result: High viral vanity reach · Minimal enquiries
    </text>
  </g>

  <!-- Card B: Customer-Led -->
  <g filter="url(#shadow)">
    <rect x="630" y="365" width="490" height="205" rx="16" fill="url(#cardGrad2)" stroke="#c99763" stroke-opacity="0.35" stroke-width="1.5" />
    <rect x="658" y="392" width="130" height="20" rx="10" fill="#c99763" fill-opacity="0.2" />
    <text x="723" y="406" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1.5" fill="#f0be89" text-anchor="middle">
      STORE B · STRATEGIC
    </text>
    <text x="658" y="445" font-family="'Playfair Display', Georgia, serif" font-size="20" fill="#faeedd">
      How to Style Outfits for Family Functions
    </text>
    <text x="658" y="485" font-family="'DM Mono', monospace" font-size="28" font-weight="700" fill="#d9ab75">
      8,000 <tspan font-size="12" font-weight="400" fill="#b08b5d">VIEWS</tspan>
    </text>
    <text x="658" y="525" font-family="'DM Mono', monospace" font-size="11" fill="#7fb07e" letter-spacing="0.5">
      Result: High-intent local buyers · 8x Customer Enquiries
    </text>
  </g>

  <!-- Footer Banner: The Core Axiom -->
  <g>
    <line x1="80" y1="620" x2="1120" y2="620" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <text x="80" y="665" font-family="'DM Mono', monospace" font-size="12" letter-spacing="2" fill="#c99763">
      CUSTOMER BEFORE CONTENT.
    </text>
    <text x="360" y="665" font-family="'DM Mono', monospace" font-size="12" letter-spacing="2" fill="#b09b88">
      PERSONALITY BEFORE PRODUCTION.
    </text>
    <text x="710" y="665" font-family="'DM Mono', monospace" font-size="12" letter-spacing="2" fill="#88b58a">
      RELATIONSHIPS BEFORE REACH.
    </text>
  </g>
</svg>
